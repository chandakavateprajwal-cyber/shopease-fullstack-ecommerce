<!DOCTYPE html>
<html>
<head>
    <title>Seller Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="auth-container">

    <form method="POST" class="auth-form">

        <h2>Seller Login</h2>

        <input type="email"
               name="email"
               placeholder="Seller Email"
               required>

        <button type="submit">
            Login
        </button>

        <p>
            New Seller?
            <a href="/seller_register">
                Register Here
            </a>
        </p>

    </form>

</div>

</body>
</html>
