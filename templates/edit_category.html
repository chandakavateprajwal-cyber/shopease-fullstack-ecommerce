<!DOCTYPE html>
<html>
<head>
    <title>Edit Category</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="navbar">

    <div class="logo">
        <a href="/admin">ShopEase Admin</a>
    </div>

    <div class="nav-links">
        <a href="/admin">Back to Admin</a>
        <a href="/">Home</a>
    </div>

</nav>

<div class="auth-container">

    <form method="POST" class="auth-form">

        <h2>Edit Category</h2>

        <input 
            type="text"
            name="category_name"
            value="{{ category.category_name }}"
            placeholder="Category Name"
            required
        >

        <input 
            type="text"
            name="image"
            value="{{ category.image }}"
            placeholder="Category Image URL"
            required
        >

        <button type="submit">
            Update Category
        </button>

    </form>

</div>

</body>
</html>
